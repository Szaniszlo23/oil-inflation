# config.yaml - every setting in the project. No codes or numbers live in the code.
# A series is `verified: true` only after its data has been downloaded and checked.
# Dates are quoted so YAML keeps them as text.

countries: [PL, RO, HU]
currencies: {PL: PLN, RO: RON, HU: HUF}

series:
  brent:
    source: fred
    code: DCOILBRENTEU            # Brent crude, Europe spot price (EIA via FRED)
    frequency: daily
    unit: USD per barrel
    start: "2000-01-01"
    verified: true

  fx:
    source: ecb
    dataset: EXR
    key: D.HUF+PLN+RON+USD.EUR.SP00.A   # daily reference rates, units of currency per EUR
    frequency: daily
    unit: national currency per EUR
    start: "2000-01-01"
    verified: true

  hicp_index:
    source: eurostat
    dataset: prc_hicp_minr        # HICP, ECOICOP ver.2 (from Jan 2026), monthly, back-cast to 2000
    unit: I25                     # Index, 2025=100
    frequency: monthly
    start: "2000-01"
    verified: true
    components:                   # coicop18 codes, checked against Eurostat's code list
      headline: TOTAL             # all-items HICP
      energy: NRG                 # flagged "definition differs" before 2017, break 2017-01
      fuels: CP0722               # fuels and lubricants for personal transport equipment
      diesel: CP07221             # from 2014-12 only
      petrol: CP07222             # from 2014-12 only
      electricity_gas: ELC_GAS    # electricity, gas, solid fuels, heat; same 2017 break as energy
      transport_services: CP073   # passenger transport services
      food: FOOD                  # food including alcohol and tobacco
      core: TOT_X_NRG_FOOD        # excl. energy, food, alcohol, tobacco; same 2017 break
      administered: AP            # administered prices
      excl_administered: TOT_X_AP # all-items excluding administered prices

  hicp_weights:
    source: eurostat
    dataset: prc_hicp_iw          # HICP item weights (per mille), ECOICOP ver.2, annual
    frequency: annual
    start: "2000"
    verified: true

  oil_bulletin:
    source: ec_oil_bulletin
    page: https://energy.ec.europa.eu/data-and-analysis/weekly-oil-bulletin_en
    history_url: null             # link changes with every update; found automatically, logged per snapshot
    frequency: weekly             # Monday prices; some 2-3 week gaps around holidays
    unit: EUR per 1000 litres     # all countries, including HU, PL, RO
    verified: true
    sheets:
      with_tax: Prices with taxes
      without_tax: Prices wo taxes
      vat: VAT                          # %, dated changes
      excise: Excise duties             # national currency per 1000 litres, dated changes
      other_taxes: Other Indirect Taxes # national currency per 1000 litres, dated changes
    columns:                      # {ctr} = country code, {fuel} = product
      with_tax: "{ctr}_price_with_tax_{fuel}"
      without_tax: "{ctr}_price_wo_tax_{fuel}"
    fuels: {petrol: euro95, diesel: diesel}
    tax_labels: {petrol: "Euro-super 95", diesel: "Gas oil automobile"}   # column labels in the tax sheets
    first_week: {PL: "2005-01-03", HU: "2005-01-03", RO: "2008-01-07"}

# Sanity checks in build.py
build:
  fx_max_staleness_days: 4          # an ECB rate may be at most this old on a bulletin date (holidays)
  implied_fx_tolerance_pct: 0.1     # bulletin's implied exchange rate vs ECB, median abs. difference (decisions D4)
  implied_fx_check_from: "2015-01-01"
  vat_mismatch_pp: 1.0              # sheet VAT vs VAT implied by prices: gap that counts as a mismatch (D17)
  vat_snap_pp: 0.2                  # implied VAT must be this close to a rate the country has used
  fixed_tax_mismatch_pct: 1.0       # excise + other taxes: sheet vs prices, % gap that counts as a mismatch
  tax_change_threshold_pct: 1.0     # weekly move in fixed taxes that counts as a tax change (95% of weekly noise is < 0.1%)

# Policy measure types allowed in interventions.csv (column `type`)
policy_types: [hard_cap, margin_cap, discount, post_cap]

# Every model runs once per option; `interactions` is the main estimate (decisions D18)
policy_handling: [interactions, ignore, dummies, exclude]

stage1:
  y: price_pre_tax_lcu              # pre-tax pump price, local currency per litre
  x: brent_lcu_prev_week            # Brent, 7-day average before the bulletin Monday (D12)
  fuels: [petrol, diesel]
  samples:                          # null start = each country's first bulletin week
    main: {start: "2008-01-07", end: null}      # common sample (D5)
    pre2020: {start: "2008-01-07", end: "2019-12-30"}
    full: {start: null, end: null}               # HU and PL from 2005
  interaction_types: [hard_cap, margin_cap, discount]   # change level, speed and impact
  level_only_types: [post_cap]                          # change the level only
  exclude_after_weeks: 8            # weeks after a measure that count as not clean
  max_lags: 8                       # AIC lag search for dy and dx
  dols_leads_lags: 4                # leads/lags of dx in the long-run (DOLS) regression
  hac_lags: 8                       # Newey-West
  horizons: [0, 1, 2, 4, 8, 12, 26, 52]   # weeks, cumulative pass-through reported
  max_horizon_weeks: 104            # path length used for "weeks to 50% / 90%"
  draws: 1000                       # simulated coefficient draws for the bands
  seed: 42
  elasticity_weeks: 104             # recent clean weeks used for the retail-price elasticity
  min_clean_weeks_for_coint: 104
  sanity: {long_run_min: 0.6, long_run_max: 1.4, max_weeks_to_90pct: 26}

stage2:
  horizons: 12
  lags: 3
  break_month: "2017-01"            # ECOICOP ver.2 back-cast break (decisions D2)
  break_components: [energy, electricity_gas, core]